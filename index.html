p{margin:0}

label{font-weight:500;font-size:15px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.chips{display:flex;gap:8px;margin:2px 0 14px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:20px;padding:6px 16px}
.chip.on{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--ln);background:var(--sf);border-radius:16px;padding:8px 8px 10px;text-align:right;color:var(--ink);display:block;width:100%;min-width:0;overflow:hidden}

.tile b{display:block}
.art{position:relative;aspect-ratio:16/9;border-radius:14px;margin-bottom:10px;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--c),#0a0f0d 150%);padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.art:before{content:"";position:absolute;width:120%;aspect-ratio:1;border-radius:50%;inset-inline-end:-45%;top:-60%;background:rgba(255,255,255,.14)}
.art:after{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;inset-inline-start:-25%;bottom:-55%;background:rgba(255,255,255,.1)}
.art>*{position:relative;z-index:1}
.ic{width:42px;height:42px}.as{font-size:12px;opacity:.92}
.art.img{padding:0;display:block;background:var(--sf)}.art.img:before,.art.img:after{display:none}.art.img img{width:100%;max-width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.035)}.art.img.big{aspect-ratio:16/9}.tile .nm{display:block;font-size:14px;font-weight:700;text-align:center;line-height:1.4;padding:6px 2px 0;overflow-wrap:anywhere}
.an{font-weight:700;font-size:15px;line-height:1.3;direction:ltr;text-align:right}
.art.big{aspect-ratio:2/1;padding:16px;border-radius:18px}.art.big .ic{width:60px;height:60px}.art.big .an{font-size:26px}

.price{font-weight:700;color:var(--pri)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font-size:18px}

.pay input{width:auto;margin:0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.st{display:inline-block;border-radius:20px;padding:2px 12px;font-size:14px;font-weight:500;background:var(--acc);color:#3a2a00}
.st.done{background:var(--pri);color:var(--onp)}.st.cancel{background:var(--bad);color:#fff}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--ln)}.steps i.on{background:var(--pri)}
.code{direction:ltr;text-align:center;font-family:monospace;font-size:18px;letter-spacing:1px;background:var(--bg);border:1px dashed var(--pri);border-radius:10px;padding:10px;margin-top:8px;word-break:break-all}
.note{background:var(--bg);border-inline-start:4px solid var(--acc);padding:10px 12px;border-radius:8px;font-size:14px;margin:10px 0}
nav{position:fixed;inset:auto 0 0 0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px);z-index:5}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--mut);padding:8px 0 4px;font-size:13px;position:relative}
nav a span{display:block;font-size:20px;line-height:1.3}
nav a.on{color:var(--pri);font-weight:700}
.bd{position:absolute;top:2px;inset-inline-start:50%;margin-inline-start:6px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;min-width:18px;line-height:18px}
#toast{position:fixed;inset:auto 16px 84px 16px;max-width:400px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
.empty{text-align:center;padding:36px 12px;color:var(--mut)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.sr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.sr input{margin:0}.sr input[type=checkbox]{width:auto}
button,a,input,select{touch-action:manipulation}html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}.tile img{max-width:100%}

/* ---------- Modern UI refresh ---------- */
:root{
 --bg:#f4f7f8;--sf:#fff;--ink:#142522;--mut:#667873;--pri:#087f68;--onp:#fff;
 --acc:#f5b942;--ln:#e3ebe8;--bad:#c34b43;--soft:#e8f5f1;
 --shadow:0 10px 28px rgba(17,53,45,.07);--shadow2:0 18px 44px rgba(17,53,45,.12);
}
:root[data-theme="dark"]{
 --bg:#0b1514;--sf:#132220;--ink:#edf7f3;--mut:#9aada7;--pri:#39c6a3;--onp:#06231c;
 --acc:#f5c45c;--ln:#263b36;--bad:#f08a80;--soft:#17352e;
 --shadow:0 10px 28px rgba(0,0,0,.2);--shadow2:0 18px 44px rgba(0,0,0,.3);
}
body{
 background:
 radial-gradient(ellipse at 8% 0%,rgba(8,127,104,.09),transparent 34rem),
 var(--bg);
 line-height:1.75;letter-spacing:0;
}
main{max-width:780px;padding:22px 18px 112px}
h1{font-size:clamp(25px,4vw,32px);font-weight:700;letter-spacing:-.5px}
h2{font-size:20px;font-weight:700;margin:24px 0 12px}
.top{margin-bottom:18px}
.back{box-shadow:var(--shadow);transition:transform .18s,background .18s}
.back:active,.btn:active,.chip:active,.tile:active{transform:scale(.985)}
input,select,textarea{
 border-radius:14px;border-color:var(--ln);background:var(--sf);
 transition:border-color .18s,box-shadow .18s;
}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 13%,transparent);outline:0}
.btn{
 border-radius:14px;padding:13px 18px;box-shadow:0 7px 16px color-mix(in srgb,var(--pri) 17%,transparent);
 transition:transform .18s,filter .18s,box-shadow .18s;
}
.btn:hover{filter:brightness(1.04);box-shadow:0 10px 22px color-mix(in srgb,var(--pri) 22%,transparent)}
.btn.alt{box-shadow:none;background:var(--sf)}
.chips{gap:9px;flex-wrap:wrap}
.chip{border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600;transition:.18s}
.chip.on{box-shadow:0 5px 14px color-mix(in srgb,var(--pri) 20%,transparent)}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{
 padding:11px 11px 13px;border-radius:20px;text-align:center;
 box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s;
}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--pri) 40%,var(--ln));box-shadow:var(--shadow2)}
.tile .nm{font-size:15px;padding-top:9px}
.art{border-radius:16px}
.art.big{border-radius:22px}
.row,.card,.pay{
 border-radius:18px;border-color:var(--ln);box-shadow:var(--shadow);
}
.row{padding:14px 16px}
.card{padding:17px;margin-bottom:14px}
.pay{box-shadow:none;transition:border-color .18s,background .18s}
.pay:has(input:checked){border-color:var(--pri);background:var(--soft)}
.price{font-variant-numeric:tabular-nums}
.code{border-radius:13px;background:var(--soft);font-weight:700}
.note{border-radius:13px;background:var(--soft);border-inline-start-width:3px}
.st{padding:4px 13px;font-weight:700}
nav{
 background:color-mix(in srgb,var(--sf) 92%,transparent);

}
nav a{max-width:190px;padding:9px 0 7px;font-weight:500}
nav a span{font-size:21px}
nav a.on{font-weight:800}
#toast{border:1px solid var(--ln);box-shadow:var(--shadow2);border-radius:15px}
.empty{padding:42px 14px}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand-lockup{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{

}
.brand-lockup h1{font-size:25px;margin:0}
.brand-lockup .mut{font-size:13px}
.theme-toggle{

 border:1px solid var(--ln);background:var(--sf);color:var(--ink);
 box-shadow:var(--shadow);font-size:19px
}
.hero{
 position:relative;overflow:hidden;border-radius:25px;padding:22px 20px;margin:0 0 17px;

}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.16);border-radius:50%;pointer-events:none}
.hero:before{width:230px;height:230px;inset-inline-end:-75px;top:-125px}
.hero:after{width:160px;height:160px;inset-inline-end:25px;bottom:-115px}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:23px;line-height:1.45;margin:0 0 6px;max-width:460px}
.hero p{color:rgba(255,255,255,.84);font-size:14px;max-width:480px}
.hero-tag{

}
.trust-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0 0 21px}

}
.trust-icon{font-size:19px}

.section-head h2{margin:0}
.search-wrap{position:relative;margin:0 0 12px}
.search-wrap input{padding-inline-start:44px;margin:0 0 12px;background:var(--sf)}

}

 .trust-item small{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


/* ---------- v2 fixes ---------- */
/* حروف عربية: أي letter-spacing يفكك اتصال الحروف */
h1,.brand-lockup h1{letter-spacing:0}
/* وضع داكن من النظام: المتغيرات الجديدة كانت ناقصة */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1514;--sf:#132220;--ink:#edf7f3;--mut:#9aada7;--pri:#39c6a3;--onp:#06231c;--acc:#f5c45c;--ln:#263b36;--bad:#f08a80;--soft:#17352e;--shadow:0 10px 28px rgba(0,0,0,.2);--shadow2:0 18px 44px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="light"]{--mut:#5a6d67}
/* التحويم فقط على الأجهزة التي تدعمه (لا يعلق على اللمس) */
.tile:hover{transform:none;border-color:var(--ln);box-shadow:var(--shadow)}
@media (hover:hover){.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--pri) 40%,var(--ln));box-shadow:var(--shadow2)}}
/* أيقونة البحث في منتصف الحقل */
.search-wrap input{margin:0}
.search-wrap:before{top:50%;transform:translateY(-50%);line-height:1}
.search-wrap input::-webkit-search-cancel-button{margin-inline-end:4px}
/* نصوص صغيرة جداً */
.trust-item small{font-size:11px}
@media(max-width:390px){.trust-item small{font-size:10px}.trust-item b{font-size:11.5px}}
/* التنبيه فوق شريط التنقل وحافة الجهاز */
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* هيكل تحميل بدل نص "جارٍ التحميل" */
.sk{background:linear-gradient(90deg,var(--ln),var(--soft),var(--ln));background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:20px}
.sk-tile{aspect-ratio:4/3}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
/* متصفحات بلا color-mix */
@supports not (color:color-mix(in srgb,red,blue)){
  .btn{box-shadow:0 7px 16px rgba(8,127,104,.17)}
  input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(8,127,104,.18)}
  .tile:hover{border-color:var(--pri)}
}
</style>

async function api(path,o={}){
  const {method="GET",body,headers={},admin=false}=o;
  const h=Object.assign({apikey:SB_KEY,"Content-Type":"application/json"},headers);
  if(admin&&SESSION)h.Authorization="Bearer "+SESSION.access_token;else if(SB_KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+SB_KEY;
  const r=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401&&admin&&SESSION&&!o.retried&&await refreshSession())return api(path,Object.assign({},o,{retried:true}));
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.msg||j.error_description))||("HTTP "+r.status));e.status=r.status;throw e}
  return j}
const rpc=(fn,args,admin)=>api("/rest/v1/rpc/"+fn,{method:"POST",body:args||{},admin:!!admin});
async function authCall(grant,body){
  const r=await fetch(SB_URL+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description||"auth");
  SESSION={access_token:j.access_token,refresh_token:j.refresh_token};lsSet("sbs",SESSION)}
async function refreshSession(){try{await authCall("refresh_token",{refresh_token:SESSION.refresh_token});return true}catch(e){SESSION=null;lsSet("sbs",null);return false}}

  const L=AD.offers||[],bn=id=>{const b=AD.brands.find(x=>x.id===id);return b?b.name:""};
  return `<div class="card"><b>إضافة عرض لعروض اليوم</b><input id="of-t" placeholder="عنوان العرض (مثال: خصم على شحن فري فاير)" maxlength="60"><textarea id="of-b" rows="2" maxlength="200" placeholder="تفاصيل العرض (اختياري)"></textarea><label for="of-br">ربطه ببطاقة (اختياري، يظهر زر اطلب الآن)</label><select id="of-br"><option value="">بدون ربط</option>${AD.brands.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("")}</select><button class="btn" onclick="addOffer()">إضافة العرض</button></div>
<div class="card"><b>العروض الحالية</b>${L.length?L.map(o=>`<div class="sr" style="flex-wrap:wrap;margin-top:10px"><span style="flex:1;min-width:140px"><b>${esc(o.title)}</b>${o.body?`<br><small class="mut">${esc(o.body)}</small>`:""}${bn(o.brand_id)?`<br><small class="mut">🔗 ${esc(bn(o.brand_id))}</small>`:""}</span><button class="btn alt sm" onclick="togOffer(${o.id},${!o.active})">${o.active?"إخفاء":"إظهار"}</button><button class="btn alt sm" onclick="delOffer(${o.id})">حذف</button></div>`).join(""):'<p class="mut">لا توجد عروض. أضف أول عرض.</p>'}</div>`}
async function offersDone(m){toast(m);await loadAOffers();renderAdmin();loadOffers()}
async function addOffer(){const t=$("of-t").value.trim(),b=$("of-b").value.trim(),br=$("of-br").value;if(!t)return toast("اكتب عنوان العرض");
  try{await api("/rest/v1/offers",{method:"POST",body:{title:t,body:b,brand_id:br||null},headers:{Prefer:"return=minimal"},admin:true});await offersDone("تمت إضافة العرض ✅")}catch(e){toast(admErr(e))}}
async function togOffer(id,a){try{await api("/rest/v1/offers?id=eq."+id,{method:"PATCH",body:{active:a},headers:{Prefer:"return=minimal"},admin:true});await offersDone(a?"ظهر العرض":"أُخفي العرض")}catch(e){toast(admErr(e))}}
async function delOffer(id){if(!confirm("حذف العرض نهائياً؟"))return;try{await api("/rest/v1/offers?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"},admin:true});await offersDone("تم حذف العرض")}catch(e){toast(admErr(e))}}
function admPrices(){
  return AD.brands.map(b=>`<div class="card"><label class="sr"><input type="checkbox" id="pb-${esc(b.id)}" ${b.active?"checked":""}><b>${esc(b.name)}</b><span class="mut">(ظاهر بالمتجر)</span></label><input id="bn-${esc(b.id)}" placeholder="ملاحظة تظهر للزبون (اختياري)" maxlength="120" value="${esc(b.note||"")}" style="margin:0 0 10px">${AD.denoms.filter(d=>d.brand_id===b.id).map(d=>`<div class="sr" style="flex-wrap:wrap"><span style="flex:1;min-width:90px">${esc(d.label)}</span><input type="number" inputmode="numeric" min="1" id="pp-${d.id}" value="${d.price}" style="width:110px"><label class="mut"><input type="checkbox" id="pa-${d.id}" ${d.available?"checked":""}>متوفر</label><button class="btn alt sm" onclick="editDenom(${d.id})">✏️ تعديل</button><button class="btn alt sm" style="color:var(--bad);border-color:var(--bad)" onclick="delDenom(${d.id})">حذف</button></div>`).join("")}<div class="sr"><input id="nl-${esc(b.id)}" placeholder="فئة جديدة" maxlength="40"><input type="number" inputmode="numeric" id="np-${esc(b.id)}" placeholder="السعر" style="width:100px"><button class="btn sm" onclick="addDenom('${esc(b.id)}')">إضافة</button></div></div>`).join("")+`<button class="btn" onclick="savePrices()">حفظ الأسعار</button>`}
async function savePrices(){
  const jobs=[],P={Prefer:"return=minimal"};
  for(const b of AD.brands){const v=$("pb-"+b.id).checked,nt=$("bn-"+b.id).value.trim();if(v!==b.active||nt!==(b.note||""))jobs.push(api("/rest/v1/brands?id=eq."+encodeURIComponent(b.id),{method:"PATCH",body:{active:v,note:nt},headers:P,admin:true}))}
  for(const d of AD.denoms){const p=parseInt(ar2en($("pp-"+d.id).value),10),a=$("pa-"+d.id).checked;
    if(!(p>0&&p<=100000000))return toast("سعر غير صحيح: "+d.label);
    if(p!==d.price||a!==d.available)jobs.push(api("/rest/v1/denoms?id=eq."+d.id,{method:"PATCH",body:{price:p,available:a},headers:P,admin:true}))}
  if(!jobs.length)return toast("لا توجد تغييرات");
  try{await Promise.all(jobs);toast("تم الحفظ ✅ يظهر للزبائن فوراً");await reloadAdmin()}catch(e){toast(admErr(e))}}
async function editDenom(id){
  const d=AD.denoms.find(x=>x.id===id);if(!d)return;
  const l=prompt("اسم الفئة:",d.label);if(l===null)return;
  const pr=prompt("السعر (د.ع):",d.price);if(pr===null)return;
  const nl=l.trim(),np=parseInt(ar2en(pr),10);
  if(!nl||!(np>0&&np<=100000000))return toast("اسم الفئة أو السعر غير صحيح");
  try{await api("/rest/v1/denoms?id=eq."+id,{method:"PATCH",body:{label:nl,price:np},headers:{Prefer:"return=minimal"},admin:true});toast("تم تعديل الفئة ✅");await reloadAdmin()}catch(e){toast(admErr(e))}}
async function delDenom(id){
  const d=AD.denoms.find(x=>x.id===id);if(!d||!confirm("حذف الفئة «"+d.label+"» نهائياً؟"))return;
  try{await api("/rest/v1/denoms?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"},admin:true});toast("تم حذف الفئة");await reloadAdmin()}
  catch(e){toast("تعذّر الحذف (مرتبطة بأكواد أو طلبات). الأفضل إلغاء علامة «متوفر» بدل الحذف")}}
async function viewReceipt(id){
  try{const r=await fetch(SB_URL+"/storage/v1/object/authenticated/receipts/"+encodeURIComponent(id)+".jpg",{headers:{apikey:SB_KEY,Authorization:"Bearer "+SESSION.access_token}});
    if(!r.ok)return toast("لا توجد صورة لهذا الطلب");
    const u=URL.createObjectURL(await r.blob()),d=document.createElement("div");
    d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px";
    d.innerHTML='<img alt="" style="max-width:100%;max-height:100%;border-radius:10px">';d.firstChild.src=u;d.onclick=()=>{d.remove();URL.revokeObjectURL(u)};document.body.appendChild(d)}
  catch(e){toast("تعذّر عرض الصورة")}}
async function ensureBalPay(){
  if(lsGet("balpay1",false))return;
  const want=[["رصيد اسياسيل","07700453034"],["رصيد زين العراق","07832219933"]],miss=want.filter(w=>!AD.pay.some(p=>p.name===w[0]));
  try{if(miss.length){await Promise.all(miss.map((w,i)=>api("/rest/v1/pay_methods",{method:"POST",body:{name:w[0],number:w[1],sort:AD.pay.length+i},headers:{Prefer:"return=minimal"},admin:true})));toast("أُضيف الدفع برصيد اسياسيل وزين العراق ✅");await loadAdminData()}lsSet("balpay1",true)}catch(e){}}
async function addDenom(bid){
  const l=$("nl-"+bid).value.trim(),p=parseInt(ar2en($("np-"+bid).value),10);if(!l||!(p>0))return toast("اكتب اسم الفئة وسعرها");
  const sort=AD.denoms.filter(d=>d.brand_id===bid).reduce((m,d)=>Math.max(m,d.sort),-1)+1;
  try{await api("/rest/v1/denoms",{method:"POST",body:{brand_id:bid,label:l,price:p,sort},headers:{Prefer:"return=minimal"},admin:true});toast("تمت إضافة الفئة");await reloadAdmin()}catch(e){toast(admErr(e))}}
function admSettings(){
  return `<div class="card"><b>وسائل الدفع</b>${AD.pay.map(p=>`<div class="sr"><input id="pmn-${p.id}" value="${esc(p.name)}" maxlength="30"><input id="pmv-${p.id}" dir="ltr" value="${esc(p.number)}" maxlength="30"><label class="mut"><input type="checkbox" id="pma-${p.id}" ${p.active?"checked":""}>فعّال</label><button class="btn alt sm" onclick="delPay(${p.id})">حذف</button></div>`).join("")}<div class="sr"><input id="pmn-new" placeholder="وسيلة جديدة" maxlength="30"><input id="pmv-new" dir="ltr" placeholder="الرقم" maxlength="30"></div></div>
<div class="card"><label for="cf-wa">رقم واتساب الإشعارات (يظهر للزبون في زر "أبلغ المتجر")</label><input id="cf-wa" dir="ltr" value="${esc(AD.cfg.wa||"")}"><label for="cf-sup">أرقام الدعم (افصل بينها بفاصلة)</label><input id="cf-sup" dir="ltr" value="${esc(AD.cfg.sup||"")}"><label for="cf-eta">مدة التسليم المتوقعة (نص)</label><input id="cf-eta" value="${esc(AD.cfg.eta||"5 إلى 10 دقائق")}" maxlength="40"><label>أوقات العمل بتوقيت بغداد (ساعة من 0 إلى 23)</label><div class="sr"><input id="cf-open" type="number" min="0" max="23" value="${esc(AD.cfg.open||"9")}" placeholder="يبدأ"><input id="cf-close" type="number" min="0" max="23" value="${esc(AD.cfg.close||"1")}" placeholder="ينتهي"></div></div><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button>`}
async function delPay(id){if(!confirm("حذف وسيلة الدفع؟"))return;try{await api("/rest/v1/pay_methods?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"},admin:true});toast("تم الحذف");await reloadAdmin()}catch(e){toast(admErr(e))}}
async function saveSettings(){
  const jobs=[],P={Prefer:"return=minimal"};
  for(const p of AD.pay){const n=$("pmn-"+p.id).value.trim(),v=ar2en($("pmv-"+p.id).value.trim()),a=$("pma-"+p.id).checked;
    if(!n||!v)return toast("أكمل اسم ورقم وسيلة الدفع");
    if(n!==p.name||v!==p.number||a!==p.active)jobs.push(api("/rest/v1/pay_methods?id=eq."+p.id,{method:"PATCH",body:{name:n,number:v,active:a},headers:P,admin:true}))}
  const nn=$("pmn-new").value.trim(),nv=ar2en($("pmv-new").value.trim());
  if(nn||nv){if(!nn||!nv)return toast("أكمل اسم ورقم الوسيلة الجديدة");jobs.push(api("/rest/v1/pay_methods",{method:"POST",body:{name:nn,number:nv,sort:AD.pay.length},headers:P,admin:true}))}
  const wa=ar2en($("cf-wa").value.trim()),sup=ar2en($("cf-sup").value).split(/[,،\s]+/).filter(Boolean);
  if(!/^07\d{9}$/.test(wa))return toast("رقم واتساب الإشعارات غير صحيح");
  if(!sup.length||sup.some(n=>!/^07\d{9}$/.test(n)))return toast("أرقام الدعم غير صحيحة");
  const op=parseInt(ar2en($("cf-open").value),10),cl=parseInt(ar2en($("cf-close").value),10),eta=$("cf-eta").value.trim();
  if(!(op>=0&&op<=23&&cl>=0&&cl<=23)||!eta)return toast("أوقات العمل أو مدة التسليم غير صحيحة");
  jobs.push(api("/rest/v1/config?on_conflict=key",{method:"POST",body:[{key:"wa",value:wa},{key:"sup",value:sup.join(",")},{key:"eta",value:eta},{key:"open",value:String(op)},{key:"close",value:String(cl)}],headers:{Prefer:"resolution=merge-duplicates,return=minimal"},admin:true}));
  try{await Promise.all(jobs);toast("تم الحفظ ✅");await reloadAdmin()}catch(e){toast(admErr(e))}}

/* ---------- التشغيل ---------- */
async function render(){
  const h=route();stopPoll();if(h!=="admin")stopAdminPoll();
  try{
    $("app").innerHTML=h.startsWith("b-")?brandPage(h.slice(2)):({home,cart:cartV,checkout,orders:ordersV,support,terms,admin:adminV}[h]||home)();
    nav();
    if(h!=="admin"&&!FRESH)startCat();
    if(h==="home"){applyF();loadOffers()}
    if(h==="orders"){refreshOrders();startPoll()}
    if(h==="admin")adminLoad();
  }catch(e){$("app").innerHTML='<div class="empty">حدث خطأ بسيط. حدّث الصفحة وحاول مرة أخرى.</div>'}}
addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&route()==="orders")refreshOrders()});
addEventListener("offline",()=>toast("لا يوجد اتصال بالإنترنت"));
addEventListener("online",()=>{toast("عاد الاتصال");CATT=0;if(!FRESH)startCat()});
render();
</script>
</body>
</html>
